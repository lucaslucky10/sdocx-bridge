name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Lock file matches pyproject.toml
        run: uv lock --check
      - name: Manifest is valid and versions agree
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          python3 -c "import json,tomllib;m=json.load(open('manifest.json'));p=tomllib.load(open('pyproject.toml','rb'));assert m['version']==p['project']['version'],(m['version'],p['project']['version'])"
      - name: Pack and start the extension the way Claude Desktop does
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 pack . sdocx-bridge.mcpb
          mkdir ext && cd ext && unzip -q ../sdocx-bridge.mcpb
          uv run --directory . --extra audio --quiet sdocx-bridge --library ../lib mcp --help
