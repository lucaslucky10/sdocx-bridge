name: Release files
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the Claude Desktop extension and the Windows folder
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "sdocx-bridge-$version.mcpb"
          git archive --format=zip --prefix="sdocx-bridge-$version/" -o "sdocx-bridge-$version-windows.zip" HEAD
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sdocx-bridge-*.mcpb sdocx-bridge-*-windows.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: sdocx-bridge-${{ env.version }}
          path: |
            sdocx-bridge-*.mcpb
            sdocx-bridge-*-windows.zip
